[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer service agent for Empório da Música (Claude + tool calling), with a CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "tzdata>=2024.1",  # timezone database (needed on Windows for zoneinfo)
]

[project.scripts]
emporio-chat = "emporio_agent.interface.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
