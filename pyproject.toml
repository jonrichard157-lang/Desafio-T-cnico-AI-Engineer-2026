[project]
name = "emporio-agent"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música (Claude + tool calling), com interface CLI e API HTTP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "tzdata>=2024.1",  # banco de fusos horários (necessário no Windows para zoneinfo)
]

[project.scripts]
emporio-chat = "emporio_agent.interface.cli:main"
emporio-api = "emporio_agent.interface.api:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
